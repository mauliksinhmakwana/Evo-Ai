<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lab - MAKWANA MAULIK</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* design variables matching your site */
        :root {
            --primary-bg: #0a0a0a;
            --secondary-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --heading-color: #ffffff;
            --accent-gradient: linear-gradient(90deg, #4285f4, #9b72cb, #d96570);
            --border-color: #333333;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-blur: blur(12px);
        }

        body { font-family: 'Poppins', sans-serif; background-color: var(--primary-bg); color: var(--text-color); margin: 0; display: flex; flex-direction: column; min-height: 100vh; overflow: hidden; }
        
        .wave-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.03; background: radial-gradient(circle at 50% 50%, #ffffff, transparent 70%); }

        /* header matching your original code */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: rgba(16, 16, 16, 0.95); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .header-name { font-size: 1.4em; font-weight: 700; color: var(--heading-color); }
        .nav-link { color: var(--text-color); text-decoration: none; font-weight: 600; font-size: 0.9em; padding: 8px 20px; border-radius: 50px; background: var(--glass-bg); border: var(--glass-border); transition: 0.3s; margin-left: 10px; }

        /* Main AI Interface */
        .main-content { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .ai-container { width: 100%; max-width: 800px; height: 80vh; background: var(--glass-bg); border: var(--glass-border); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        .chat-header { padding: 20px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 85%; padding: 12px 18px; border-radius: 18px; font-size: 0.95em; line-height: 1.5; }
        .user-msg { align-self: flex-end; background: #fff; color: #000; }
        .bot-msg { align-self: flex-start; background: var(--secondary-bg); border: 1px solid var(--border-color); color: #fff; }

        .input-area { padding: 20px; display: flex; gap: 10px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border-color); }
        input { flex-grow: 1; background: #000; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; color: #fff; outline: none; }
        button { background: var(--accent-gradient); border: none; width: 50px; border-radius: 12px; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div class="wave-background"></div>

    <header class="header">
        <span class="header-name">MAKWANA MAULIK</span>
        <nav>
            <a href="index.html" class="nav-link">Home</a>
            <a href="#" class="nav-link">AI Lab</a>
        </nav>
    </header>

    <main class="main-content">
        <div class="ai-container">
            <div class="chat-header">
                <i class="fas fa-robot" style="color: #4285f4;"></i>
                <span style="font-weight: 700;">AIML API INTERFACE (Gemini 1.5)</span>
            </div>
            <div class="chat-messages" id="chat-box">
                <div class="message bot-msg">Hello! I am connected via AIML API. How can I help you today?</div>
            </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Ask Gemini something..." autocomplete="off">
                <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <script>
        // 1. PASTE YOUR AIML API KEY HERE
        const AIML_API_KEY = "51b7ed51f73940deade35d0c7df67c14"; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}-msg`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function getAIResponse(prompt) {
            try {
                const response = await fetch("https://api.aimlapi.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${AIML_API_KEY}`,
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "gemini-1.5-flash", // You can also use "gpt-4o" or "claude-3-5-sonnet"
                        messages: [
                            { role: "user", content: prompt }
                        ],
                        max_tokens: 512,
                    }),
                });

                const data = await response.json();
                return data.choices[0].message.content;
            } catch (error) {
                return "Error: Could not connect to AIML API. Check your key and balance.";
            }
        }

        async function handleChat() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            const loading = appendMessage("Typing...", 'bot');
            const aiReply = await getAIResponse(text);
            loading.innerText = aiReply;
        }

        sendBtn.onclick = handleChat;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleChat(); };
    </script>
</body>
</html>
